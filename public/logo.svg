<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" role="img" aria-label="GardenCalcs leaf logo">
  <title>GardenCalcs</title>
  <defs>
    <mask id="gc-cutouts" maskUnits="userSpaceOnUse">
      <rect width="200" height="240" fill="white"/>
      <g fill="black">
        <!-- Central vein horizontal dashes -->
        <rect x="93" y="30" width="14" height="4" rx="0.5"/>
        <rect x="93" y="46" width="14" height="4" rx="0.5"/>
        <rect x="93" y="62" width="14" height="4" rx="0.5"/>
        <rect x="93" y="78" width="14" height="4" rx="0.5"/>
        <rect x="93" y="94" width="14" height="4" rx="0.5"/>
        <rect x="93" y="110" width="14" height="4" rx="0.5"/>
        <rect x="93" y="126" width="14" height="4" rx="0.5"/>
        <rect x="93" y="142" width="14" height="4" rx="0.5"/>
        <rect x="93" y="158" width="14" height="4" rx="0.5"/>
        <rect x="93" y="174" width="14" height="4" rx="0.5"/>
        <rect x="93" y="190" width="14" height="4" rx="0.5"/>
        <rect x="93" y="206" width="14" height="4" rx="0.5"/>
      </g>
      <!-- Edge tick marks: thin lines angled to point inward toward the central vein -->
      <g stroke="black" stroke-width="3" stroke-linecap="butt">
        <!-- Right edge ticks (top to bottom) -->
        <line x1="139" y1="32"  x2="148" y2="29"/>
        <line x1="155" y1="44"  x2="163" y2="40"/>
        <line x1="165" y1="58"  x2="173" y2="55"/>
        <line x1="171" y1="74"  x2="179" y2="72"/>
        <line x1="174" y1="92"  x2="182" y2="91"/>
        <line x1="175" y1="110" x2="183" y2="110"/>
        <line x1="174" y1="130" x2="182" y2="130"/>
        <line x1="174" y1="148" x2="182" y2="149"/>
        <line x1="171" y1="166" x2="179" y2="168"/>
        <line x1="165" y1="182" x2="173" y2="185"/>
        <line x1="155" y1="196" x2="163" y2="200"/>
        <line x1="139" y1="208" x2="148" y2="211"/>

        <!-- Left edge ticks (mirror) -->
        <line x1="61" y1="32"  x2="52" y2="29"/>
        <line x1="45" y1="44"  x2="37" y2="40"/>
        <line x1="35" y1="58"  x2="27" y2="55"/>
        <line x1="29" y1="74"  x2="21" y2="72"/>
        <line x1="26" y1="92"  x2="18" y2="91"/>
        <line x1="25" y1="110" x2="17" y2="110"/>
        <line x1="26" y1="130" x2="18" y2="130"/>
        <line x1="26" y1="148" x2="18" y2="149"/>
        <line x1="29" y1="166" x2="21" y2="168"/>
        <line x1="35" y1="182" x2="27" y2="185"/>
        <line x1="45" y1="196" x2="37" y2="200"/>
        <line x1="61" y1="208" x2="52" y2="211"/>
      </g>
    </mask>
  </defs>

  <!-- Leaf body (almond shape) with mask cutouts -->
  <path d="M 100 16
           C 148 16 178 60 178 120
           C 178 180 148 222 100 222
           C 52 222 22 180 22 120
           C 22 60 52 16 100 16 Z"
        fill="#3a5a40"
        mask="url(#gc-cutouts)"/>

  <!-- Stem (no mask, simple rect) -->
  <rect x="97" y="222" width="6" height="14" fill="#3a5a40"/>
</svg>
